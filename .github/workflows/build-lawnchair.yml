name: Build Lawnchair APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch: # Permet de lancer le build manuellement d'un clic sur GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Important si Lawnchair utilise des sous-modules Git

      # 2. Configuration de l'environnement Java (Lawnchair nécessite Java 17 ou supérieur selon les versions)
      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Met en cache les dépendances pour accélérer les prochains builds

      # 3. Rendre le script Gradle exécutable (Sécurité Linux)
      - name: Accorder les permissions d'exécution à Gradle
        run: chmod +x gradlew

      # 4. Nettoyage et compilation de l'APK de Release
      - name: Compilation avec Gradle
        run: ./gradlew assembleRelease --no-daemon

      # 5. Vérification et affichage de l'espace restant (comme tu aimes le faire 😉)
      - name: Diagnostic Système de fin de build
        run: |
          echo "=== RAM RESTANTE ==="
          free -m
          echo "=== ESPACE DISQUE RESTANT ==="
          df -h /
          echo "=== LISTE DES FICHIERS APK GÉNÉRÉS ==="
          find . -name "*.apk" -type f -exec ls -lh {} +

      # 6. Extraction de l'APK final pour pouvoir le télécharger sur ton tableau de bord
      - name: Téléverser l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-Release-APK
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error

